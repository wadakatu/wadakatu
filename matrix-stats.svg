<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="wadakatu@zion:~$ ./stats --all-time">
<style>
text{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
.ttl{font-size:14px;fill:#008f11}
.lbl{font-size:13px;fill:#7dff9b;letter-spacing:1px}
.val{font-size:22px;font-weight:700;fill:#00ff41}
.big{font-size:40px;font-weight:700;fill:#00ff41}
.sm{font-size:12px;fill:#008f11}
.bar{fill:#00ff41;transform-box:fill-box;transform-origin:left bottom;animation:grow 1.2s ease-out both}
.vbar{fill:#00ff41;transform-box:fill-box;transform-origin:center bottom;animation:rise 1.2s ease-out both}
.track{fill:#003b00;opacity:.45}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes rise{from{transform:scaleY(0)}}
@media (prefers-reduced-motion:reduce){.bar,.vbar{animation:none}}
</style>
