name: profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Matrix stats cards
        # Public data only; private work shows up as a count if "Include private contributions" is on in profile settings.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/matrix_cards.py ${{ github.repository_owner }} dist
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/matrix-snake.svg?color_snake=#00ff41&color_dots=#0d1a0f,#003b00,#008f11,#00c832,#00ff41
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
